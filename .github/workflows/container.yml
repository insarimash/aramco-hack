name: Build and publish container

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag cbam-review:test .
      - name: Smoke test the production server
        run: |
          docker run --detach --name cbam-review --publish 127.0.0.1:3000:3000 cbam-review:test
          trap 'docker logs cbam-review; docker rm --force cbam-review' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused http://127.0.0.1:3000/ --output page.html
          grep --quiet 'Fertilizer CBAM review' page.html
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' http://127.0.0.1:3000/api/review)
          test "$status" = 503
          grep --quiet 'Upstage API key' response.json
      - name: Save verified image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: docker save cbam-review:test | gzip > cbam-review.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: cbam-review
          path: cbam-review.tar.gz
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cbam-review
      - name: Publish verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load --input cbam-review.tar.gz
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag cbam-review:test "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
